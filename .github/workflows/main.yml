name: .NET Build

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    # 🔽 新增：监听版本 Tag 推送
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3.5.2
        with:
          fetch-depth: 0

      # 安装 .NET Core
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3.0.3
        with:
          dotnet-version: "6.0.x"

      # 安装 NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.2.0
        with:
          nuget-version: "5.x"

      # 还原 NuGet 包
      - name: NuGet restore
        run: nuget restore

      # 添加 MSBuild.exe 到环境变量
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.3.1

      # 编译整个项目
      - name: Build the solution
        run: |
          msbuild -t:restore /p:GitFlow="Github Action"
          msbuild -target:"InkCanvasPlus" /p:Configuration=Release /p:Platform="Any CPU" /p:GitFlow="Github Action"
        env:
          Configuration: ${{ matrix.configuration }}

      # 上传编译成品
      - name: Upload to artifact
        uses: actions/upload-artifact@main
        with:
          name: Ink-Canvas
          path: Ink Canvas/bin/Release

      # 下载 Inno Setup 翻译文件
      - name: Download Inno Setup Translation Files
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseTraditional.isl"

      # 用 Inno Setup 打包
      - name: Build installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/setup.iss

      # 上传安装包
      - name: Upload installer
        uses: actions/upload-artifact@main
        with:
          name: Ink-Canvas-Installer
          path: packaging/output/Ink-Canvas-Plus_setup*.exe

  # 🆕 新增 Release 任务
  release:
    needs: build
    runs-on: ubuntu-latest
    # 🔽 仅在推送 Tag 时运行，普通 push 和 PR 不会触发
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 从 build 任务下载安装包产物
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Ink-Canvas-Installer
          path: ./release-assets

      # 3. 创建 Release 并上传安装包
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          # 你可以根据喜好修改 body 内容
          body: |
            🎉 这是 ${{ github.ref_name }} 版本的自动发布。

            更新内容请查看提交历史。
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
