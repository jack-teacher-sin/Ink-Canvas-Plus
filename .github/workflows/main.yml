name: .NET Build

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    # 🔽 监听版本 Tag 推送
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 安装 .NET Core
      - name: Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "6.0.x"

      # 安装 NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
        with:
          nuget-version: "5.x"

      # 还原 NuGet 包
      - name: NuGet restore
        run: nuget restore

      # 添加 MSBuild.exe 到环境变量: https://github.com/microsoft/setup-msbuild
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # 编译整个项目
      - name: Build the solution
        run: |
          msbuild -t:restore /p:GitFlow="Github Action"
          msbuild -target:"InkCanvasPlus" /p:Configuration=Release /p:Platform="Any CPU" /p:GitFlow="Github Action"
        env:
          Configuration: ${{ matrix.configuration }}

      # 上传编译成品
      - name: Upload to artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ink-Canvas
          path: Ink Canvas/bin/Release

      # 下载 Inno Setup 翻译文件
      - name: Download Inno Setup Translation Files
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseTraditional.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseTraditional.isl"

      # 用 Inno Setup 打包
      - name: Build installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@72b8e3d017d7aca25b688c5e1ba29f655350efc8
        with:
          path: packaging/setup.iss

      # 上传安装包
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Ink-Canvas-Installer
          path: packaging/output/Ink-Canvas-Plus_setup*.exe
          archive: false

  # 🆕 Release 任务
  release:
    needs: build
    runs-on: ubuntu-latest
    # 🔽 仅在推送 Tag 或手动触发时运行，普通 push 和 PR 不会触发
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. 从 build 任务下载安装包产物
      #    build 任务以 archive: false 上传单个文件，此时 artifact 的名称会被文件名取代
      #    （Ink-Canvas-Plus_setup_<版本>.exe），故不能再按固定名称 Ink-Canvas-Installer 下载
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: Ink-Canvas-Plus_setup_*
          path: ./release-assets
          merge-multiple: true

      # 3. 创建 Release 并上传安装包
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            🎉 这是 ${{ github.ref_name }} 版本的自动发布。

            更新内容请查看提交历史。
          files: ./release-assets/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

